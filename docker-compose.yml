version: '3.8'

services:
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: expense-manager-backend
    ports:
      - "8000:8000"
    volumes:
      - ./backend:/var/www/html
      - /var/www/html/vendor
    environment:
      - DB_HOST=db
      - DB_PORT=3306
      - DB_DATABASE=expense_manager
      - DB_USERNAME=expense_user
      - DB_PASSWORD=expense_password
    depends_on:
      - db
    networks:
      - expense-network

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: expense-manager-frontend
    ports:
      - "5173:5173"
    volumes:
      - ./frontend:/app
      - /app/node_modules
    environment:
      - VITE_API_URL=https://dev.expense-manager.com/api
    depends_on:
      - backend
    networks:
      - expense-network

  db:
    image: mysql:8.0
    container_name: expense-manager-db
    ports:
      - "3306:3306"
    environment:
      - MYSQL_ROOT_PASSWORD=root_password
      - MYSQL_DATABASE=expense_manager
      - MYSQL_USER=expense_user
      - MYSQL_PASSWORD=expense_password
    volumes:
      - db_data:/var/lib/mysql
    networks:
      - expense-network

  nginx:
    image: nginx:alpine
    container_name: expense-manager-nginx
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./nginx.conf:/etc/nginx/conf.d/default.conf
      - ./ssl:/etc/nginx/ssl
    depends_on:
      - backend
      - frontend
    networks:
      - expense-network

volumes:
  db_data:

networks:
  expense-network:
    driver: bridge
